# Конфигурация Loki для демонстрации: конфигурация образа grafana/otel-lgtm 0.30.0
# (https://github.com/grafana/docker-otel-lgtm/blob/v0.30.0/docker/loki-config.yaml, Apache License 2.0)
# с добавленным limits_config.otlp_config: атрибут ресурса onec.infobase.name становится
# индексируемой меткой onec_infobase_name в дополнение к меткам Loki по умолчанию (service_name и др.).

auth_enabled: false

server:
  http_listen_port: 3100

common:
  instance_addr: 127.0.0.1
  path_prefix: /data/loki
  storage:
    filesystem:
      chunks_directory: /data/loki/chunks
      rules_directory: /data/loki/rules
  replication_factor: 1
  ring:
    kvstore:
      store: inmemory

schema_config:
  configs:
    - from: 2020-10-24
      store: tsdb
      object_store: filesystem
      schema: v13
      index:
        prefix: index_
        period: 24h

limits_config:
  otlp_config:
    resource_attributes:
      attributes_config:
        - action: index_label
          attributes:
            - onec.infobase.name

ruler:
  alertmanager_url: http://127.0.0.1:9093

pattern_ingester:
  lifecycler:
    min_ready_duration: 1s

ingester:
  lifecycler:
    min_ready_duration: 1s

frontend:
  scheduler_dns_lookup_period: 1s
  address: 127.0.0.1

query_scheduler:
  use_scheduler_ring: false
